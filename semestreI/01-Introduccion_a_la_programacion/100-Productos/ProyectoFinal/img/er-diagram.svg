  <text x="410" y="138" text-anchor="end" font-family="monospace" font-size="12" fill="#98c379">VARCHAR(100)</text>

  <rect x="60" y="151" width="380" height="38" fill="#16213e" stroke="#2a2a4e" stroke-width="1"/>
  <text x="115" y="176" font-family="monospace" font-size="14" fill="#e0e0e0">email</text>
  <text x="410" y="176" text-anchor="end" font-family="monospace" font-size="12" fill="#98c379">VARCHAR(150)</text>

  <rect x="60" y="189" width="380" height="38" fill="#1a1a3e" stroke="#2a2a4e" stroke-width="1"/>
